# A virtual workspace: `core/` is the technology-free library that decides,
# `cli/` the published cargo subcommand, `xtask/` the gates. The family's shape,
# from the start.
[workspace]
members = ["core", "cli", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Umberto Gotti <umberto.gotti@umbertogotti.dev>"]
license = "MIT"
repository = "https://github.com/umbgtt10/ripe4rust"

[workspace.dependencies]
proc-macro2 = { version = "1.0", features = ["span-locations"] }
ripe4rust-core = { path = "core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0.117", features = ["full", "visit"] }
tempfile = "3"
toml = { version = "1.2", default-features = false, features = ["parse", "std"] }

# ripe4rust plans this workspace too: the gates that validate a change, the
# same two every commit passes, and the library others depend on, whose public
# API a breaking upgrade can break (rule 8). `cargo-ripe4rust` is on crates.io
# too, but it is installed as a subcommand: its library is there for its own
# tests, and no one builds against it.
[workspace.metadata.ripe4rust]
gates = ["just stage1", "just stage2"]
published = ["ripe4rust-core"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
