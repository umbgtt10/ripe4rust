# A virtual workspace: `core/` is the technology-free library that decides,
# `cli/` the published cargo subcommand. The family's shape, from the start.
[workspace]
members = ["core", "cli"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Umberto Gotti <umberto.gotti@umbertogotti.dev>"]
license = "MIT"
repository = "https://github.com/umbgtt10/ripe4rust"

[workspace.dependencies]
ripe4rust-core = { path = "core", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
